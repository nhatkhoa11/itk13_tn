<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10 - Thùy Ngân</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #ffd1dc, #ffe3e8, #fff0f5);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-x: hidden; position: relative;
        }
        .card {
            background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(230, 57, 70, 0.15); max-width: 420px; width: 100%; text-align: center;
            border: 2px solid #ffb6c1; position: relative; z-index: 10;
        }
        /* Khung ảnh hình vuông bo góc */
        .avatar-box { 
            position: relative; 
            width: 200px; 
            height: 200px; 
            margin: 0 auto 18px; 
            border-radius: 16px; 
            overflow: hidden; 
            border: 4px solid #ff4d6d; 
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.25);
        }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .upload-btn {
            position: absolute; bottom: 8px; right: 8px; background: rgba(255, 77, 109, 0.9); color: white; border: none;
            border-radius: 12px; padding: 6px 12px; font-size: 12px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); backdrop-filter: blur(4px);
        }
        h2 { color: #d63384; font-size: 24px; margin-bottom: 5px; }
        .tag { background: #ffe6eb; color: #ff4d6d; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .message { color: #555; font-size: 15px; line-height: 1.6; background: #fff0f3; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid #ff4d6d; text-align: left; }
        .from-input-box { display: flex; align-items: center; justify-content: center; gap: 5px; color: #c2185b; font-weight: bold; font-size: 14px; }
        .from-input-box input { border: none; border-bottom: 2px dashed #ff4d6d; background: transparent; font-size: 14px; font-weight: bold; color: #d63384; padding: 2px 5px; text-align: center; outline: none; width: 180px; }
        .heart { position: fixed; color: #ff4d6d; font-size: 18px; top: -20px; animation: fall linear infinite; z-index: 1; pointer-events: none; }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-box">
            <img id="photo" src="photo.jpg" alt="Thùy Ngân">
            <button class="upload-btn" onclick="document.getElementById('file-input').click()">📷 Đổi ảnh</button>
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="changeImage(event)">
        </div>
        <h2>Nguyễn Thị Thùy Ngân</h2>
        <div class="tag">💖 Chúc Mừng Ngày 20/10 💖</div>
        <div class="message">
            Chúc Thùy Ngân ngày 20/10 dịu dàng, đáng yêu và gặp thật nhiều may mắn! Mong bạn luôn đạt kết quả cao trong học tập, luôn hạnh phúc và gặt hái thêm nhiều thành công!
        </div>
        <div class="from-input-box">
            💌 From: Các chàng trai ITK13
        </div>
    </div>

    <script>
        function changeImage(e) {
            const file = e.target.files[0];
            if(file) document.getElementById('photo').src = URL.createObjectURL(file);
        }
        function createHeart() {
            const h = document.createElement('div'); h.classList.add('heart'); h.innerHTML = '💖';
            h.style.left = Math.random() * 100 + 'vw'; h.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(h); setTimeout(() => h.remove(), 5000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
